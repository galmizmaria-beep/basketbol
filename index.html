  function questionsPanel(){let h='<div class="panel-actions"><button data-action="add-question">+ Добавить задание</button></div>';project.questions.forEach((q,i)=>{h+=`<div class="q-card ${q.id===selectedQ?'selected':''}"><button data-question="${e(q.id)}">${i+1}. ${e(q.prompt.slice(0,90))}</button><p class="help">${B.types[q.type]} · ${q.points} баллов</p><div class="panel-actions"><button data-q-action="up" data-id="${e(q.id)}" ${i===0?'disabled':''}>↑</button><button data-q-action="down" data-id="${e(q.id)}" ${i===project.questions.length-1?'disabled':''}>↓</button><button data-q-action="duplicate" data-id="${e(q.id)}">Копия</button><button data-q-action="delete" data-id="${e(q.id)}" class="danger">Удалить</button></div></div>`});const i=project.questions.findIndex(q=>q.id===selectedQ);if(i<0)return h;const q=project.questions[i],path=`questions.${i}`;h+='<h3>Редактирование задания</h3>'+select('Тип',path+'.type',B.types)+area('Текст задания',path+'.prompt')+help('Формулы из шпаргалки: $a^2$, $\\frac{3}{4}$, $\\sqrt{x}$; крупная формула — $$...$$. Поддерживаются индексы, суммы, пределы, геометрические знаки и cases.')+media('Изображение / GIF к заданию',path+'.asset')+field('Баллы',path+'.points','number','min="0" max="10000"')+area('Пояснение после ответа',path+'.explanation');
    if(['single','multiple','order'].includes(q.type)){h+=help(q.type==='order'?'Правильный порядок соответствует списку ниже. Перед показом ученику элементы перемешиваются.':'Отметьте правильные ответы.');q.options.forEach((o,j)=>{const op=path+`.options.${j}`;h+=`<div class="option-edit">`+field('Вариант '+(j+1),op+'.text')+(q.type!=='order'?check('Правильный',op+'.correct'):'' )+media('Изображение варианта',op+'.asset')+`<div class="panel-actions"><button data-option-action="up" data-index="${j}" ${j===0?'disabled':''}>↑</button><button data-option-action="down" data-index="${j}" ${j===q.options.length-1?'disabled':''}>↓</button><button data-option-action="delete" data-index="${j}">Удалить</button></div></div>`});h+='<button data-action="add-option">+ Вариант ответа</button>';if(q.type!=='order')h+=check('Перемешивать варианты',path+'.shuffle')}

    if(q.type==='oral')h+=select('Режим ответа',path+'.oralMode',{self:'Самопроверка: Верно / Неверно',continue:'Ответ дан — продолжить'});return h;

  function bindSettings(){
    $('settings').querySelectorAll('[data-path]').forEach(el=>el.addEventListener(el.tagName==='TEXTAREA'||el.type==='text'||el.type==='color'||el.type==='range'?'input':'change',()=>{if(testing)stopTest();let value=el.type==='checkbox'?el.checked:['number','range'].includes(el.type)?Number(el.value):el.value;if(typeof value==='number'){if(!Number.isFinite(value))return;if(el.min!=='')value=Math.max(Number(el.min),value);if(el.max!=='')value=Math.min(Number(el.max),value);el.value=value}commit();const path=el.dataset.path;if(path.startsWith('loseScreen.'))finalScreen='lose';if(path.startsWith('winScreen.'))finalScreen='win';set(path,value);if(path.endsWith('.correct')&&value){const m=path.match(/^questions\.(\d+)\.options\.(\d+)\.correct$/);if(m&&project.questions[m[1]].type==='single')project.questions[m[1]].options.forEach((o,i)=>o.correct=i===Number(m[2]))}if(path.endsWith('.type')){const q=project.questions[Number(path.split('.')[1])];if(q.type==='single')q.options.forEach((o,i)=>o.correct=i===0)}changed(path==='language'||path.endsWith('.type')||path.endsWith('.correct'))}));
    $('settings').querySelectorAll('[data-answers]').forEach(el=>el.onchange=()=>{commit();project.questions[el.dataset.answers].answers=el.value.split('\n').map(s=>s.trim()).filter(Boolean);changed()});
    $('settings').querySelectorAll('[data-media]').forEach(el=>el.onchange=()=>{if(el.files[0])upload(el.files[0],el.dataset.media)});
    $('settings').querySelectorAll('[data-clear-media]').forEach(el=>el.onclick=()=>{commit();set(el.dataset.clearMedia,'');changed(true)});
    $('settings').querySelectorAll('[data-object]').forEach(el=>el.onclick=()=>{selected=el.dataset.object;renderPreview();renderInspector();if(tab==='scene')renderSettings()});
    $('settings').querySelectorAll('[data-question]').forEach(el=>el.onclick=()=>{selectedQ=el.dataset.question;renderSettings();renderPreview()});
    $('settings').querySelectorAll('[data-q-action]').forEach(el=>el.onclick=()=>questionAction(el.dataset.qAction,el.dataset.id));
    $('settings').querySelectorAll('[data-option-action]').forEach(el=>el.onclick=()=>optionAction(el.dataset.optionAction,Number(el.dataset.index)));

  function action(a){if(a==='export')return downloadGame();if(a==='copy')return copyCode();if(a==='optimize')return optimize();if(a==='add-question'){commit();const q=B.question();project.questions.push(q);selectedQ=q.id;changed(true)}if(a==='add-option'){const q=project.questions.find(q=>q.id===selectedQ);if(!q)return;commit();q.options.push({id:B.uid(),text:'Новый вариант',correct:false,asset:''});changed(true)}if(a==='add-decor'){commit();const o={...B.clone(project.scene.objects.find(o=>o.id==='ball')),id:B.uid(),name:'Декорация',kind:'decor',x:500,y:100,w:90,h:90,z:2,asset:''};project.scene.objects.push(o);selected=o.id;changed(true)}}
  function questionAction(a,id){const i=project.questions.findIndex(q=>q.id===id);if(i<0)return;commit();if(a==='delete'){project.questions.splice(i,1);selectedQ=project.questions[Math.min(i,project.questions.length-1)]?.id||''}if(a==='duplicate'){const q=B.clone(project.questions[i]);q.id=B.uid();q.options.forEach(o=>o.id=B.uid());project.questions.splice(i+1,0,q);selectedQ=q.id}if(a==='up'||a==='down'){const j=i+(a==='up'?-1:1);if(j>=0&&j<project.questions.length)[project.questions[i],project.questions[j]]=[project.questions[j],project.questions[i]]}changed(true)}
  function optionAction(a,i){const q=project.questions.find(q=>q.id===selectedQ);if(!q)return;commit();if(a==='delete')q.options.splice(i,1);else{const j=i+(a==='up'?-1:1);if(j>=0&&j<q.options.length)[q.options[i],q.options[j]]=[q.options[j],q.options[i]]}changed(true)}
  function renderPreview(screen){

    const scene=$('preview-root').querySelector('.game-scene');if(mode!=='court'&&mode!=='question')return;scene.classList.add('edit-scene');
    $('preview-root').querySelectorAll('[data-object]').forEach(el=>{const o=project.scene.objects.find(o=>o.id===el.dataset.object);el.dataset.locked=o.locked;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',o.name);if(o.id===selected){el.classList.add('selected');if(!o.locked)for(const corner of ['nw','ne','sw','se']){const handle=document.createElement('button');handle.className='resize-handle';handle.dataset.corner=corner;handle.setAttribute('aria-label','Изменить размер '+corner);el.append(handle)}}el.onpointerdown=ev=>beginDrag(ev,o,el)});

  function beginDrag(ev,o,el){if(ev.button!==0)return;ev.preventDefault();const isResize=ev.target.dataset.corner;selected=o.id;renderInspector();$('preview-root').querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));el.classList.add('selected');if(o.locked)return;
    const before=B.clone(o),startX=ev.clientX,startY=ev.clientY,scale=$('preview-root').clientWidth/1200;let moved=false;el.setPointerCapture(ev.pointerId);
    function move(event){let dx=(event.clientX-startX)/scale,dy=(event.clientY-startY)/scale;if(!moved&&Math.abs(dx)+Math.abs(dy)<2)return;if(!moved){commit();moved=true}if(isResize){const west=isResize.includes('w'),north=isResize.includes('n');let w=Math.max(20,before.w+(west?-dx:dx)),h=Math.max(20,before.h+(north?-dy:dy));if(event.shiftKey){const ratio=before.w/before.h;if(Math.abs(dx)>Math.abs(dy))h=w/ratio;else w=h*ratio}o.w=Math.round(w);o.h=Math.round(h);o.x=Math.round(before.x+(west?before.w-w:0));o.y=Math.round(before.y+(north?before.h-h:0))}else{o.x=Math.round(Math.max(-o.w+20,Math.min(1180,before.x+dx)));o.y=Math.round(Math.max(-o.h+20,Math.min(655,before.y+dy)))}Object.assign(el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px'});renderInspector()}
    function end(){el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);renderPreview();if(moved)scheduleSave();if(tab==='scene')renderSettings()}
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  }
  function renderInspector(){const o=project.scene.objects.find(o=>o.id===selected);if(testing){$('inspector').innerHTML='<h3>Режим игры</h3><p class="help">Ответьте на задания, чтобы проверить броски, таймер и финальные экраны. Для изменений нажмите «Редактировать».</p>';return}if(!o){$('inspector').innerHTML='<h3>Выберите объект на сцене</h3>';return}const i=project.scene.objects.indexOf(o),path=`scene.objects.${i}`;$('inspector').innerHTML=`<h3>Выбран объект: ${e(o.name)}</h3><div class="inspector-grid">`+[['X','x',-2400,2400],['Y','y',-1350,1350],['Ширина','w',20,2400],['Высота','h',20,1350],['Поворот','rotation',-360,360],['Прозрачн.','opacity',0,1],['Слой','z',0,50]].map(([label,key,min,max])=>field(label,path+'.'+key,'number',`min="${min}" max="${max}" step="${key==='opacity'?'.05':'1'}" ${o.locked?'disabled':''}`)).join('')+`</div><div class="panel-actions"><button data-obj-action="front">Вперёд</button><button data-obj-action="back">Назад</button><button data-obj-action="lock">${o.locked?'Разблокировать':'Блокировать'}</button><button data-obj-action="hide">${o.hidden?'Показать':'Скрыть'}</button><button data-obj-action="duplicate" ${o.kind==='hud'?'disabled':''}>Дублировать</button><button data-obj-action="delete" ${o.kind!=='decor'?'disabled title="Обязательный объект игры"':''}>Удалить</button></div>`;
    $('inspector').querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{const v=Math.max(Number(el.min),Math.min(Number(el.max),Number(el.value)));if(!Number.isFinite(v))return;commit();set(el.dataset.path,v);changed()});
    $('inspector').querySelectorAll('[data-obj-action]').forEach(el=>el.onclick=()=>{commit();switch(el.dataset.objAction){case 'front':o.z=Math.min(50,o.z+1);break;case 'back':o.z=Math.max(0,o.z-1);break;case 'lock':o.locked=!o.locked;break;case 'hide':o.hidden=!o.hidden;break;case 'duplicate':const c=B.clone(o);c.id=B.uid();c.art=o.art||o.kind;c.kind='decor';if(o.kind==='player')c.asset=o.asset||project.player.idle;c.name=o.name+' (копия)';c.x+=25;c.y+=25;c.locked=false;project.scene.objects.push(c);selected=c.id;break;case 'delete':if(o.kind==='decor'){project.scene.objects.splice(i,1);selected='player'}break}changed(tab==='scene')});
  }
  function renderAll(){if(!project.questions.some(q=>q.id===selectedQ))selectedQ=project.questions[0]?.id||'';renderSettings();renderPreview();renderInspector();buttons();size()}
  function startTest(){const errors=validation();if(errors.length)return showErrors(errors);testing=true;game?.destroy();game=mountBasketball($('preview-root'),project);$('screen-label').textContent='Тестирование игры';buttons();renderInspector()}
  function stopTest(){testing=false;renderAll()}
  function formatBytes(n){return n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(2)+' МБ'}
  function size(){$('size-status').textContent=project.questions.length+' заданий · '+formatBytes(new Blob([JSON.stringify(project)]).size)}
  async function upload(file,path){
    const rev=revision;const audio=/^audio/.test(file.type)||/\.(mp3|wav|ogg)$/i.test(file.name);const type=audio?(file.type||(/\.ogg$/i.test(file.name)?'audio/ogg':/\.wav$/i.test(file.name)?'audio/wav':'audio/mpeg')):file.type;
    if(!/^(image\/(png|jpeg|webp|gif)|audio\/(mpeg|mp3|wav|x-wav|ogg))$/.test(type))return toast('Допустимы PNG, JPEG, WebP, GIF и MP3, WAV, OGG.');if(file.size>25*1048576)return toast('Файл больше 25 МБ. Уменьшите его перед загрузкой.');
    toast('Загружаю медиа…');try{let data=await readData(file),blob=file;if(!audio&&type!=='image/gif'){const image=await loadImage(data);const max={balanced:1600,high:2400,small:1000}[project.meta.quality];const scale=Math.min(1,max/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const optimized=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.84));if(optimized&&optimized.size<file.size){blob=optimized;data=await readData(optimized)}}if(rev!==revision)return toast('Проект изменился во время загрузки. Выберите файл ещё раз.');if(testing)stopTest();commit();const id=B.uid();project.assets[id]={name:file.name,type:blob.type||type,data,size:blob.size,originalSize:file.size};if(audio&&!/^data:audio\//.test(data))project.assets[id].data='data:'+type+data.slice(data.indexOf(';'));set(path,id);changed(true);toast(type==='image/gif'?'GIF сохранён с анимацией'+(file.size>3*1048576?' · крупный файл, проверьте размер экспорта.':'.'):'Медиа добавлено: '+formatBytes(file.size)+' → '+formatBytes(blob.size))}catch(err){toast('Не удалось загрузить медиа: '+err.message)}
  }
  const readData=blob=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});
  const loadImage=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Не удалось прочитать изображение'));i.src=src});
  function validation(){const errors=B.validate(project);const clean=B.compact(project);for(const [id,a] of Object.entries(clean.assets))if(!B.allowedAsset(a))errors.push('Некорректное медиа: '+a.name);const refs=new Set([project.scene.background,project.titleScreen.background,project.winScreen.background,project.loseScreen.background,project.player.idle,project.player.success,project.player.miss,project.scoring.lifeAsset,...project.scene.objects.map(o=>o.asset),...project.questions.flatMap(q=>[q.asset,...q.options.map(o=>o.asset)]),...Object.values(project.audio.assets)].filter(Boolean));refs.forEach(id=>{if(!project.assets[id])errors.push('Медиа не найдено: '+id)});return errors}
  function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  const safeJSON=value=>JSON.stringify(value).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  function exportHTML(input=project,light=project.exportSettings.light){const p=B.compact(input);const lang=B.words[p.language]||B.words.ru;const script=BUNDLE.math+'\nconst Basketball={clone:'+B.clone.toString()+',escape:'+B.escape.toString()+',check:'+B.check.toString()+',words:'+safeJSON({[p.language]:lang})+'};';const runtime=light?BUNDLE.game.split('\n').map(line=>line.trim()).filter(line=>line&&!line.startsWith('//')).join('\n'):BUNDLE.game;const css=light?BUNDLE.css.replace(/\s+/g,' ').replace(/\s*([{}:;,])\s*/g,'$1'):BUNDLE.css;return '<!doctype html>\n<html lang="'+e(p.language)+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+e(p.meta.name)+'</title><style>html,body{margin:0;background:#102c35;min-height:100%;display:grid;place-items:center}body{width:100%}#game{width:min(100vw,177.777vh)}'+css+'</style></head><body><main id="game" aria-label="'+e(p.meta.name)+'"></main><script>'+script+'\n'+runtime+'\nmountBasketball(document.getElementById("game"),'+safeJSON(p)+');<\/script></body></html>'}
  function downloadGame(){const errors=validation();if(errors.length)return showErrors(errors);const html=exportHTML();download('basketball-game.html',html,'text/html');toast('Игра скачана: '+formatBytes(new Blob([html]).size))}
  const iframeCode=html=>'<iframe title="'+e(project.meta.name)+'" width="1200" height="675" style="width:100%;aspect-ratio:16/9;height:auto;border:0" allow="autoplay; fullscreen" allowfullscreen srcdoc="'+e(html)+'"></iframe>';
  async function compressHTML(html){
    if(typeof CompressionStream==='undefined')return {html,compressed:false};
    const stream=new Blob([html]).stream().pipeThrough(new CompressionStream('gzip'));const bytes=new Uint8Array(await new Response(stream).arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));const payload=btoa(binary);
    const loader='<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#0b1e36;color:white;font:18px Arial"><div id="loading" style="padding:20px">Загрузка игры…</div><script>(async()=>{try{if(typeof DecompressionStream==="undefined")throw Error("Откройте игру в современном браузере");const data=Uint8Array.from(atob("'+payload+'"),c=>c.charCodeAt(0));const html=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById("loading").textContent="Не удалось загрузить игру: "+e.message}})();<\/script></body></html>';
    return loader.length<html.length?{html:loader,compressed:true}:{html,compressed:false};
  }
  async function lighterProject(input){
    const p=B.compact(input);for(const [id,a] of Object.entries(p.assets)){
      if(p.exportSettings.hostBuiltins&&typeof BasketballAssets!=='undefined'&&BasketballAssets[id]?.data===a.data){const files={'builtin-arena':'arena.jpg','builtin-hero':'hero.png','builtin-hoop':'hoop.png','builtin-ball':'ball.png'};if(files[id]){a.data='https://raw.githubusercontent.com/galmizmaria-beep/basketbol/main/assets/'+files[id];continue}}
      if(!/^image\/(png|jpeg|webp)$/.test(a.type)||typeof createImageBitmap==='undefined')continue;
      try{const image=await createImageBitmap(await (await fetch(a.data)).blob());const max=id===p.scene.background||id===p.titleScreen.background||id===p.winScreen.background||id===p.loseScreen.background?960:512;const scale=Math.min(1,max/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);image.close?.();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.73));if(blob&&blob.size<a.size){a.data=await readData(blob);a.size=blob.size;a.type=blob.type}}
      catch{} // An unreadable image stays original; GIF/audio are never flattened or removed.
    }return p;
  }
  async function prepareGenially(){
    if(preparedEmbed?.revision===revision)return preparedEmbed;
    const rev=revision,original=iframeCode(exportHTML(project,false));const input=project.exportSettings.light?await lighterProject(project):B.compact(project);const plain=exportHTML(input,true);const packed=await compressHTML(plain);if(rev!==revision)throw Error('Проект изменился во время сжатия. Повторите подготовку кода.');
    preparedEmbed={revision:rev,code:iframeCode(packed.html),before:new Blob([original]).size,after:new Blob([iframeCode(packed.html)]).size,html:plain,compressed:packed.compressed};return preparedEmbed;
  }
  async function copyCode(){const errors=validation();if(errors.length)return showErrors(errors);try{const prepared=await prepareGenially();await copyPrepared(prepared.code)}catch(error){toast(error.message)}}
  async function copyPrepared(code){try{await navigator.clipboard.writeText(code);toast('Код для Genially скопирован · '+formatBytes(new Blob([code]).size))}catch{modal('Код для Genially','Выделите и скопируйте код вручную.',`<textarea id="manual-copy" readonly aria-label="Код для вставки">${e(code)}</textarea>`,[{label:'Закрыть',action:closeModal}]);$('manual-copy').select()}}
  async function optimize(){
    const errors=validation();if(errors.length)return showErrors(errors);commit();project.exportSettings.light=true;scheduleSave();toast('Облегчаю код для Genially…');$('optimize').disabled=true;
    try{const prepared=await prepareGenially();const percent=Math.max(0,Math.round(100*(1-prepared.after/prepared.before)));modal('Код для Genially готов','Оригинальный проект и предпросмотр сохранены.',`<div class="export-report">До: ${formatBytes(prepared.before)}<br>После: ${formatBytes(prepared.after)}<br>Уменьшение: ${percent}%</div><p class="help">${project.exportSettings.hostBuiltins?'Встроенные ассеты загружаются из вашего GitHub. Пользовательские медиа остаются в коде.':'Все медиа остаются в коде.'}</p>`,[{label:'Копировать код',action:async()=>{closeModal();await copyPrepared(prepared.code)}},{label:'Скачать код',action:()=>download('basketball-genially.txt',prepared.code,'text/plain')},{label:'Закрыть',action:closeModal}]);if(tab==='export')renderSettings()}
    catch(error){toast('Не удалось облегчить код: '+error.message)}finally{$('optimize').disabled=false}
  }
  function modal(title,text,body='',actions=[]){const root=$('modal-root');root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card"><h2 id="modal-title">${e(title)}</h2><p class="help">${e(text)}</p>${body}<div class="panel-actions" id="modal-actions"></div></div></div>`;actions.forEach(({label,action})=>{const b=document.createElement('button');b.textContent=label;b.onclick=action;$('modal-actions').append(b)});root.querySelector('button,textarea')?.focus()}
  const closeModal=()=>{$('modal-root').innerHTML=''};
  function showErrors(errors){modal('Проверьте проект','Исправьте ошибки перед тестированием и экспортом.','<div class="export-report">'+e(errors.join('\n'))+'</div>',[{label:'Закрыть',action:closeModal}])}
  $('tabs').onclick=ev=>{const key=ev.target.dataset.tab;if(!key)return;if(testing){testing=false;game?.destroy()}tab=key;if(key==='player')selected='player';if(key==='equipment')selected='hoop';if(key==='scoring')selected='hud';renderAll()};
  $('save-project').onclick=()=>{const p=B.compact(project);download('project.basketball.json',JSON.stringify(p,null,2),'application/json');toast('Проект сохранён вместе с медиа')};
  $('load-project').onclick=()=>{$('project-file').value='';$('project-file').click()};
  $('project-file').onchange=async()=>{const f=$('project-file').files[0];if(!f)return;if(f.size>100*1048576)return toast('Проект слишком большой (лимит 100 МБ).');try{const p=B.load(JSON.parse(await f.text()));if(testing){testing=false;game?.destroy()}commit();project=p;selectedQ=p.questions[0]?.id||'';selected='player';renderAll();scheduleSave();toast('Проект восстановлен')}catch(err){toast('Ошибка проекта: '+err.message)}};
  $('export-html').onclick=downloadGame;$('optimize').onclick=optimize;$('copy-code').onclick=copyCode;$('undo').onclick=undo;$('redo').onclick=redo;$('test').onclick=startTest;$('preview').onclick=stopTest;
  document.addEventListener('keydown',ev=>{if($('modal-root').firstChild){if(ev.key==='Escape')closeModal();if(ev.key==='Tab'){const controls=[...$('modal-root').querySelectorAll('button,textarea')];if(ev.shiftKey&&document.activeElement===controls[0]){ev.preventDefault();controls.at(-1).focus()}else if(!ev.shiftKey&&document.activeElement===controls.at(-1)){ev.preventDefault();controls[0].focus()}}return}const textInput=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!textInput){ev.preventDefault();ev.shiftKey?redo():undo();return}if(testing||textInput)return;const o=project.scene.objects.find(o=>o.id===selected);if(!o||o.locked)return;const delta=ev.shiftKey?10:1;const moves={ArrowLeft:[-delta,0],ArrowRight:[delta,0],ArrowUp:[0,-delta],ArrowDown:[0,delta]};if(moves[ev.key]){ev.preventDefault();commit();o.x+=moves[ev.key][0];o.y+=moves[ev.key][1];changed()}});
  async function initStorage(){try{db=await new Promise((resolve,reject)=>{const request=indexedDB.open('basketball-editor',1);request.onupgradeneeded=()=>request.result.createObjectStore('projects');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});const saved=await new Promise((resolve,reject)=>{const req=db.transaction('projects','readonly').objectStore('projects').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(saved&&revision===0)modal('Продолжить редактирование?','На этом устройстве найден сохранённый проект «'+saved.meta.name+'».','',[{label:'Продолжить редактирование',action:()=>{try{project=B.load(saved);renderAll();closeModal();toast('Автосохранение восстановлено')}catch(err){closeModal();toast(err.message)}}},{label:'Начать заново',action:()=>{closeModal();persist()}}])}catch{$('save-status').textContent='Автосохранение недоступно. Скачивайте JSON-проект.'}}
  renderAll();initStorage();
})();
</script>
